<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOM Visualizer</title>
    <!-- Inline so the single-file build keeps it on file:// -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 11v5M8 21v-5h16v5' fill='none' stroke='%23007aff' stroke-width='2.5' stroke-linejoin='round'/%3E%3Crect x='10' y='2' width='12' height='9' rx='2' fill='%23007aff'/%3E%3Crect x='2' y='21' width='12' height='9' rx='2' fill='%23007aff'/%3E%3Crect x='18' y='21' width='12' height='9' rx='2' fill='%23007aff'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the theme before first paint. Key must match THEME_KEY in src/ui/theme.ts.
      (function () {
        var stored;
        try {
          stored = localStorage.getItem('bom-visualizer.theme');
        } catch (e) {}
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <header id="toolbar"></header>
    <main>
      <aside id="config-panel"></aside>
      <section id="tree">
        <p class="placeholder muted">No document open. Use File &gt; New or File &gt; Open…</p>
      </section>
      <aside id="editor"></aside>
      <div class="resizer" data-panel="config" title="Drag to resize; double-click to reset"></div>
      <div class="resizer" data-panel="editor" title="Drag to resize; double-click to reset"></div>
    </main>
    <div id="toast" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
